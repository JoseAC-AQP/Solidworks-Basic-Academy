/* ==========================================================================
SOLIDWORKS ACADEMY - DESIGN SYSTEM & COMPONENTS (Production CSS)
Compatibility: All modern browsers, Tailwind CSS integrated
========================================================================== */

/* --------------------------------------------------------------------------

DESIGN TOKENS & CSS VARIABLES
-------------------------------------------------------------------------- /
:root {
/ Brand Colors */
--primary: #102A43;
--primary-light: #243B53;
--primary-dark: #091C2E;

--accent: #00B3E0;
--accent-hover: #0090B3;
--accent-light: #E0F8FF;

/* Neutral Colors */
--bg-light: #F3F6F8;
--bg-card: #FFFFFF;
--text-dark: #1F2937;
--text-muted: #6B7280;
--border: #E5E7EB;
--border-focus: #00B3E0;

/* State Feedback Colors */
--success: #10B981;
--success-bg: #ECFDF5;
--warning: #F59E0B;
--warning-bg: #FFFBEB;
--danger: #EF4444;
--danger-bg: #FEF2F2;
--info: #3B82F6;
--info-bg: #EFF6FF;

/* Shadows & Radius */
--radius-sm: 6px;
--radius-md: 10px;
--radius-lg: 16px;
--shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

/* --------------------------------------------------------------------------
2. GLOBAL NAVIGATION BAR STYLES
-------------------------------------------------------------------------- */
.navbar {
background-color: var(--primary);
color: #FFFFFF;
display: flex;
justify-content: space-between;
align-items: center;
padding: 0.85rem 1.75rem;
box-shadow: var(--shadow-md);
position: sticky;
top: 0;
z-index: 50;
}

.navbar .brand {
display: flex;
align-items: center;
gap: 0.6rem;
font-weight: 800;
font-size: 1.15rem;
color: #FFFFFF;
text-decoration: none;
letter-spacing: 0.5px;
}

.navbar .brand span {
color: var(--accent);
}

.navbar .nav-links {
display: flex;
list-style: none;
gap: 0.5rem;
margin: 0;
padding: 0;
align-items: center;
}

.navbar .nav-links a,
.navbar .nav-links button {
color: #D1D5DB;
text-decoration: none;
padding: 0.5rem 0.85rem;
border-radius: var(--radius-sm);
font-size: 0.875rem;
font-weight: 600;
transition: all 0.2s ease;
background: transparent;
border: none;
cursor: pointer;
}

.navbar .nav-links a:hover,
.navbar .nav-links button:hover,
.navbar .nav-links a.active {
color: var(--accent);
background: rgba(0, 179, 224, 0.1);
}

/* --------------------------------------------------------------------------
3. CARDS & CONTAINER COMPONENTS
-------------------------------------------------------------------------- */
.card {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: var(--radius-md);
padding: 1.5rem;
margin-bottom: 1.5rem;
box-shadow: var(--shadow-sm);
transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
border-color: #CBD5E1;
box-shadow: var(--shadow-md);
}

.card-title {
color: var(--primary);
font-size: 1.2rem;
font-weight: 700;
margin-top: 0;
margin-bottom: 0.75rem;
display: flex;
align-items: center;
gap: 0.5rem;
}

.card-header {
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid var(--border);
padding-bottom: 0.75rem;
margin-bottom: 1rem;
}

/* --------------------------------------------------------------------------
4. BUTTONS & INTERACTIVE ELEMENTS
-------------------------------------------------------------------------- */
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
background-color: var(--accent);
color: var(--primary-dark);
font-weight: 700;
font-size: 0.875rem;
padding: 0.65rem 1.25rem;
border-radius: var(--radius-sm);
border: 1px solid transparent;
cursor: pointer;
text-decoration: none;
transition: all 0.2s ease;
box-shadow: 0 2px 4px rgba(0, 179, 224, 0.2);
}

.btn:hover {
background-color: var(--accent-hover);
color: #FFFFFF;
box-shadow: 0 4px 8px rgba(0, 144, 179, 0.3);
}

.btn-outline {
background-color: transparent;
border-color: var(--primary);
color: var(--primary);
box-shadow: none;
}

.btn-outline:hover {
background-color: var(--primary);
color: #FFFFFF;
}

.btn-danger {
background-color: var(--danger);
color: #FFFFFF;
}

.btn-danger:hover {
background-color: #DC2626;
}

/* --------------------------------------------------------------------------
5. BADGES & COMPETENCY STATUS TAGS
-------------------------------------------------------------------------- */
.badge {
display: inline-block;
padding: 0.25rem 0.6rem;
font-size: 0.75rem;
font-weight: 700;
border-radius: 9999px;
text-transform: uppercase;
letter-spacing: 0.5px;
}

.badge-success {
background-color: var(--success-bg);
color: #065F46;
border: 1px solid #A7F3D0;
}

.badge-warning {
background-color: var(--warning-bg);
color: #92400E;
border: 1px solid #FDE68A;
}

.badge-danger {
background-color: var(--danger-bg);
color: #991B1B;
border: 1px solid #FECACA;
}

.badge-info {
background-color: var(--info-bg);
color: #1E40AF;
border: 1px solid #BFDBFE;
}

/* --------------------------------------------------------------------------
6. PROGRESS BARS & METRIC INDICATORS
-------------------------------------------------------------------------- */
.progress-container {
width: 100%;
height: 10px;
background-color: #E5E7EB;
border-radius: 9999px;
overflow: hidden;
margin: 0.5rem 0;
}

.progress-bar {
height: 100%;
background: linear-gradient(90deg, var(--accent) 0%, var(--accent-hover) 100%);
border-radius: 9999px;
transition: width 0.4s ease;
}

/* --------------------------------------------------------------------------
7. CAD VIEWPORT & SIMULATION CONTAINERS
-------------------------------------------------------------------------- */
.cad-viewport {
width: 100%;
height: 380px;
background-color: #0F172A;
border-radius: var(--radius-md);
border: 1px solid #334155;
position: relative;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
color: #94A3B8;
}

.cad-viewport-controls {
position: absolute;
top: 10px;
right: 10px;
display: flex;
gap: 0.5rem;
z-index: 10;
}

.cad-btn-icon {
background: rgba(30, 41, 59, 0.8);
color: #FFFFFF;
border: 1px solid #475569;
padding: 0.4rem 0.6rem;
border-radius: var(--radius-sm);
font-size: 0.75rem;
cursor: pointer;
backdrop-filter: blur(4px);
transition: background 0.2s ease;
}

.cad-btn-icon:hover {
background: var(--accent);
color: var(--primary-dark);
}

/* --------------------------------------------------------------------------
8. ALERT BOXES & NOTIFICATIONS
-------------------------------------------------------------------------- */
.alert-box {
padding: 1rem;
border-radius: var(--radius-sm);
margin-bottom: 1rem;
display: flex;
align-items: flex-start;
gap: 0.75rem;
font-size: 0.9rem;
}

.alert-success {
background-color: var(--success-bg);
border-left: 4px solid var(--success);
color: #065F46;
}

.alert-warning {
background-color: var(--warning-bg);
border-left: 4px solid var(--warning);
color: #92400E;
}

.alert-danger {
background-color: var(--danger-bg);
border-left: 4px solid var(--danger);
color: #991B1B;
}

/* --------------------------------------------------------------------------
9. RESPONSIVE UTILITIES
-------------------------------------------------------------------------- */
.grid-2 {
display: grid;
grid-template-columns: 1fr;
gap: 1.5rem;
}

@media (min-width: 768px) {
.grid-2 {
grid-template-columns: repeat(2, 1fr);
}
}

.space-y > * + * {
margin-top: 1rem;
}
