name: Deploy SOLIDWORKS Academy to GitHub Pages

on:
push:
branches:
- main
- master
workflow_dispatch:

Permisos requeridos para publicar en GitHub Pages

permissions:
contents: read
pages: write
id-token: write

Prevenir ejecuciones concurrentes para evitar condiciones de carrera

concurrency:
group: 'pages'
cancel-in-progress: true

jobs:
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
- name: Checkout Código Fuente
uses: actions/checkout@v4

  - name: Configurar GitHub Pages
    uses: actions/configure-pages@v4

  - name: Cargar Artefactos de la Aplicación Web
    uses: actions/upload-pages-artifact@v3
    with:
      path: '.'

  - name: Desplegar en GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
